AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Synapse Health REST backend. Deployment requires authorization.
Parameters:
  FirebaseProjectId:
    Type: String
    AllowedPattern: '[a-z][a-z0-9-]{4,62}'
  FirebaseCredentialSecretArn:
    Type: String
    Description: Existing Secrets Manager ARN, never a credential value.
    AllowedPattern: 'arn:[a-z-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+'
  AllowedOrigin:
    Type: String
    Default: https://synapse.invalid
    AllowedPattern: 'https://[a-zA-Z0-9.-]+(:[0-9]+)?'
  EnableDynamoHistory: {Type: String, Default: 'false', AllowedValues: ['true', 'false']}
  EnableCognitoAuth: {Type: String, Default: 'false', AllowedValues: ['true', 'false']}
  EnableFlashcardCrud: {Type: String, Default: 'false', AllowedValues: ['true', 'false']}
  EnableQuizBackend: {Type: String, Default: 'false', AllowedValues: ['true', 'false']}
  EnableAcademicViews: {Type: String, Default: 'false', AllowedValues: ['true', 'false']}
Rules:
  FlashcardsRequireCognito:
    Assertions:
      - Assert: !Or [!Equals [!Ref EnableFlashcardCrud, 'false'], !Equals [!Ref EnableCognitoAuth, 'true']]
        AssertDescription: Flashcard CRUD requires Cognito authentication.
  QuizzesRequireCognito:
    Assertions:
      - Assert: !Or [!Equals [!Ref EnableQuizBackend, 'false'], !Equals [!Ref EnableCognitoAuth, 'true']]
        AssertDescription: Quiz backend requires Cognito authentication.
  AcademicViewsRequireQuizzes:
    Assertions:
      - Assert: !Or [!Equals [!Ref EnableAcademicViews, 'false'], !And [!Equals [!Ref EnableQuizBackend, 'true'], !Equals [!Ref EnableCognitoAuth, 'true']]]
        AssertDescription: Academic views require Cognito and the quiz backend.
Conditions:
  CreateFlashcardContent: !And [!Equals [!Ref EnableFlashcardCrud, 'true'], !Equals [!Ref EnableCognitoAuth, 'true']]
  CreateCognitoAuth: !Equals [!Ref EnableCognitoAuth, 'true']
  CreateAcademicViews: !And [!Equals [!Ref EnableAcademicViews, 'true'], !Condition CreateQuizBackend]
  CreateQuizBackend: !And [!Equals [!Ref EnableQuizBackend, 'true'], !Equals [!Ref EnableCognitoAuth, 'true']]
  CreateAcademicContent: !Or [!Condition CreateFlashcardContent, !Condition CreateQuizBackend]
  CreateFutureHistoryTable: !Or [!Equals [!Ref EnableDynamoHistory, 'true'], !Condition CreateQuizBackend]
Resources:
  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      EndpointConfiguration: {Type: REGIONAL}
      Cors:
        AllowMethods: "'GET,POST,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Authorization,Content-Type,If-Match,Idempotency-Key'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
          DataTraceEnabled: false
          MetricsEnabled: false
      GatewayResponses:
        THROTTLED:
          StatusCode: '429'
          ResponseParameters:
            Headers:
              Retry-After: "'60'"
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
          ResponseTemplates:
            application/json: '{"error":{"code":"rate_limited","message":"Try again later."}}'
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-history", RetentionInDays: 14}
  BackendRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BackendLogsAndCredentialRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-history:*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref FirebaseCredentialSecretArn
              - !If [CreateFlashcardContent, {Effect: Allow, Action: ['dynamodb:GetItem', 'dynamodb:PutItem', 'dynamodb:DeleteItem', 'dynamodb:Query', 'dynamodb:UpdateItem'], Resource: !GetAtt FlashcardContentTable.Arn}, !Ref AWS::NoValue]
              - !If [CreateQuizBackend, {Effect: Allow, Action: ['dynamodb:GetItem', 'dynamodb:Query', 'dynamodb:UpdateItem'], Resource: !GetAtt FlashcardContentTable.Arn}, !Ref AWS::NoValue]
              - !If [CreateQuizBackend, {Effect: Allow, Action: ['dynamodb:GetItem', 'dynamodb:Query', 'dynamodb:PutItem'], Resource: !GetAtt FutureHistoryTable.Arn}, !Ref AWS::NoValue]
              - !If [CreateAcademicViews, {Effect: Allow, Action: ['dynamodb:DeleteItem'], Resource: !GetAtt FutureHistoryTable.Arn}, !Ref AWS::NoValue]
  BackendFunction:
    Type: AWS::Serverless::Function
    DependsOn: BackendLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-history
      CodeUri: ./
      Handler: dist/index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 20
      ReservedConcurrentExecutions: 5
      Role: !GetAtt BackendRole.Arn
      Environment:
        Variables:
          FIREBASE_PROJECT_ID: !Ref FirebaseProjectId
          FIREBASE_CREDENTIAL_SECRET_ARN: !Ref FirebaseCredentialSecretArn
          USER_RATE_LIMIT: '30'
          FLASHCARDS_RATE_LIMIT: '60'
          FLASHCARDS_TABLE_NAME: !If [CreateFlashcardContent, !Ref FlashcardContentTable, '']
          QUIZZES_TABLE_NAME: !If [CreateQuizBackend, !Ref FlashcardContentTable, '']
          QUIZ_RESULTS_TABLE_NAME: !If [CreateQuizBackend, !Ref FutureHistoryTable, '']
          QUIZZES_RATE_LIMIT: '60'
          ACADEMIC_VIEWS_ENABLED: !If [CreateAcademicViews, 'true', 'false']
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          COGNITO_USER_POOL_ID: !If [CreateCognitoAuth, !Ref CognitoUserPool, '']
          COGNITO_CLIENT_ID: !If [CreateCognitoAuth, !Ref CognitoFlutterClient, '']
      Events:
        Health:
          Type: Api
          Properties: {RestApiId: !Ref RestApi, Path: /api/v1/health, Method: GET}
        Flashcards:
          Type: Api
          Properties: {RestApiId: !Ref RestApi, Path: /api/v1/flashcards, Method: ANY}
        FlashcardDetail:
          Type: Api
          Properties: {RestApiId: !Ref RestApi, Path: '/api/v1/flashcards/{id}', Method: ANY}
        Quizzes:
          Type: Api
          Properties: {RestApiId: !Ref RestApi, Path: /api/v1/quizzes, Method: ANY}
        QuizResources:
          Type: Api
          Properties: {RestApiId: !Ref RestApi, Path: '/api/v1/quizzes/{proxy+}', Method: ANY}
        PersonalProgress:
          Type: Api
          Properties: {RestApiId: !Ref RestApi, Path: /api/v1/progress/me, Method: GET}
        Ranking:
          Type: Api
          Properties: {RestApiId: !Ref RestApi, Path: /api/v1/ranking, Method: GET}
        OwnRank:
          Type: Api
          Properties: {RestApiId: !Ref RestApi, Path: /api/v1/ranking/me, Method: GET}
        CognitoSession:
          Type: Api
          Properties: {RestApiId: !Ref RestApi, Path: /api/v1/auth/session, Method: GET}
        History:
          Type: Api
          Properties: {RestApiId: !Ref RestApi, Path: /api/v1/history, Method: GET}
        HistoryDetail:
          Type: Api
          Properties: {RestApiId: !Ref RestApi, Path: '/api/v1/history/{id}', Method: GET}
        ProfileRead:
          Type: Api
          Properties: {RestApiId: !Ref RestApi, Path: /v1/me/profile, Method: GET}
        ProfileWrite:
          Type: Api
          Properties: {RestApiId: !Ref RestApi, Path: /v1/me/profile, Method: PATCH}
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Condition: CreateCognitoAuth
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-auth
      UsernameAttributes: [email]
      UsernameConfiguration: {CaseSensitive: false}
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting: {RecoveryMechanisms: [{Name: verified_email, Priority: 1}]}
      UserAttributeUpdateSettings: {AttributesRequireVerificationBeforeUpdate: [email]}
      Policies:
        PasswordPolicy: {MinimumLength: 12, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: true, TemporaryPasswordValidityDays: 7}
      Schema:
        - {Name: email, AttributeDataType: String, Required: true, Mutable: true}
        - {Name: name, AttributeDataType: String, Required: false, Mutable: true}
      MfaConfiguration: 'OFF'
      VerificationMessageTemplate: {DefaultEmailOption: CONFIRM_WITH_CODE}
      EmailConfiguration: {EmailSendingAccount: COGNITO_DEFAULT}
  CognitoFlutterClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: CreateCognitoAuth
    Properties:
      ClientName: !Sub ${AWS::StackName}-flutter
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH]
      SupportedIdentityProviders: [COGNITO]
      ReadAttributes: [email, email_verified, name]
      WriteAttributes: [email, name]
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 7
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: days}
      RefreshTokenRotation: {Feature: ENABLED, RetryGracePeriodSeconds: 10}
      AuthSessionValidity: 3
  ContentAdmins:
    Type: AWS::Cognito::UserPoolGroup
    Condition: CreateFlashcardContent
    Properties: {GroupName: admins, UserPoolId: !Ref CognitoUserPool, Description: Explicitly assigned content editors; no users are granted automatically.}
  FlashcardContentTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateAcademicContent
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: PK, AttributeType: S}, {AttributeName: SK, AttributeType: S}]
      KeySchema: [{AttributeName: PK, KeyType: HASH}, {AttributeName: SK, KeyType: RANGE}]
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
  FutureHistoryTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateFutureHistoryTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: userKey, AttributeType: S}, {AttributeName: entryKey, AttributeType: S}, {AttributeName: historyOrder, AttributeType: S}]
      KeySchema: [{AttributeName: userKey, KeyType: HASH}, {AttributeName: entryKey, KeyType: RANGE}]
      GlobalSecondaryIndexes:
        - {IndexName: ByDate, KeySchema: [{AttributeName: userKey, KeyType: HASH}, {AttributeName: historyOrder, KeyType: RANGE}], Projection: {ProjectionType: ALL}}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
Outputs:
  ApiBaseUrl:
    Value: !Sub https://${RestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/dev/
  HistoryStorage:
    Value: Firebase history remains active; Cognito quiz storage is opt-in.
  CognitoPoolId:
    Condition: CreateCognitoAuth
    Value: !Ref CognitoUserPool
  CognitoAppClientId:
    Condition: CreateCognitoAuth
    Value: !Ref CognitoFlutterClient
  CognitoRegion: {Condition: CreateCognitoAuth, Value: !Ref AWS::Region}
  QuizContentTableName: {Condition: CreateQuizBackend, Value: !Ref FlashcardContentTable}
  QuizResultsTableName: {Condition: CreateQuizBackend, Value: !Ref FutureHistoryTable}
